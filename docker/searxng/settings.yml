# Configuracion para uso interno (API del backend en Docker). No exponer a Internet sin limiter.
use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - google

general:
  instance_name: "Bar Inventory SearxNG"
  debug: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "bar-inventory-searxng-dev-secret-replace-in-production"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "es"
  formats:
    - html
    - json

outgoing:
  request_timeout: 10.0
  max_request_timeout: 25.0

engines:
  - name: duckduckgo
    timeout: 10.0
  - name: google
    timeout: 10.0
