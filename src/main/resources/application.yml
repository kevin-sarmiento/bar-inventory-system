spring:
  application:
    name: bar-inventory-system
  r2dbc:
    url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/bar_inventory}
    username: ${DB_USERNAME:bar_user}
    password: ${DB_PASSWORD:bar_pass}
  flyway:
    enabled: true
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/bar_inventory}
    user: ${DB_USERNAME:bar_user}
    password: ${DB_PASSWORD:bar_pass}
  main:
    web-application-type: reactive
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-me-please-very-long-secret}
  expiration-minutes: 120

ai:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2:3b}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
  web-search:
    enabled: ${AI_WEB_SEARCH_ENABLED:false}
    base-url: ${AI_WEB_SEARCH_BASE_URL:}
    max-results: ${AI_WEB_SEARCH_MAX_RESULTS:5}
    timeout-seconds: ${AI_WEB_SEARCH_TIMEOUT_SECONDS:30}
